<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonjour Noemie</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fff8f0;
      font-family: 'Georgia', serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 6rem);
      color: #2c2c2c;
      text-align: center;
      letter-spacing: 0.02em;
    }

    p {
      font-size: clamp(1.2rem, 3.5vw, 2.5rem);
      color: #555;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 2rem;
      margin-top: 0.5rem;
    }

    button {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-family: 'Georgia', serif;
      padding: 0.6em 2em;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    #btn-oui {
      background-color: #e8a0b4;
      color: #fff;
    }

    #btn-oui:hover {
      transform: scale(1.07);
      box-shadow: 0 4px 14px rgba(232, 160, 180, 0.5);
    }

    #btn-non {
      background-color: #ddd;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bonjour Noemie</h1>
    <p>Veut tu date avec moi ?</p>
    <div class="buttons">
      <button id="btn-oui">Oui</button>
      <button id="btn-non">Non</button>
    </div>
  </div>

  <script>
    const btnNon = document.getElementById('btn-non');

    btnNon.addEventListener('mouseover', () => {
      const margin = 80;
      const x = margin + Math.random() * (window.innerWidth - margin * 2);
      const y = margin + Math.random() * (window.innerHeight - margin * 2);
      btnNon.style.position = 'fixed';
      btnNon.style.left = x + 'px';
      btnNon.style.top = y + 'px';
    });
  </script>
</body>
</html>
