<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonjour Noemie</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fff8f0;
      font-family: 'Georgia', serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 6rem);
      color: #2c2c2c;
      text-align: center;
      letter-spacing: 0.02em;
    }

    p {
      font-size: clamp(1.2rem, 3.5vw, 2.5rem);
      color: #555;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 2rem;
      margin-top: 0.5rem;
    }

    button {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-family: 'Georgia', serif;
      padding: 0.6em 2em;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    #btn-oui {
      background-color: #e8a0b4;
      color: #fff;
    }

    #btn-oui:hover {
      transform: scale(1.07);
      box-shadow: 0 4px 14px rgba(232, 160, 180, 0.5);
    }

    #btn-non {
      background-color: #ddd;
      color: #555;
      transition: left 0.1s ease, top 0.1s ease, transform 0.1s ease;
    }

    #page-2 {
      display: none;
      position: fixed;
      inset: 0;
      background-color: #fff8f0;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      opacity: 0;
      transition: opacity 0.8s ease;
    }

    #page-2.visible {
      display: flex;
      opacity: 1;
    }

    .cards {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      flex-wrap: wrap;
      position: fixed;
      bottom: 2rem;
      left: 0;
      right: 0;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 1.4em 1.8em;
      max-width: 200px;
      text-align: center;
      font-size: 0.95rem;
      color: #2c2c2c;
      line-height: 1.6;
      opacity: 0;
      transform: translateY(40px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .card.active {
      border: 2px solid #e8a0b4;
      box-shadow: 0 4px 20px rgba(232, 160, 180, 0.35);
      cursor: default;
    }

    #page-3 .texte {
      font-size: clamp(1rem, 1.8vw, 1.2rem);
      max-width: 750px;
      line-height: 1.8;
      color: #2c2c2c;
      text-align: center;
    }

    #page-2 .texte {
      font-size: clamp(1.1rem, 2.5vw, 1.8rem);
      color: #2c2c2c;
      text-align: center;
      max-width: 750px;
      line-height: 1.8;
    }

    #curseur {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: #e8a0b4;
      vertical-align: text-bottom;
      animation: clignoter 0.7s step-end infinite;
    }

    @keyframes clignoter {
      50% { opacity: 0; }
    }

    @media (max-width: 600px) {
      h1 { font-size: clamp(2rem, 11vw, 3.5rem); }

      p { font-size: clamp(1rem, 4.5vw, 1.4rem); }

      button { font-size: 1rem; padding: 0.7em 1.8em; }

      #page-2 .texte { font-size: 1rem; padding: 0 0.5rem; }

      #page-3 .texte {
        font-size: 0.95rem;
        padding: 0 1rem;
        padding-bottom: 130px;
      }

      .cards {
        gap: 0.7rem;
        bottom: 1rem;
        padding: 0 0.8rem;
      }

      .card {
        padding: 0.8em 1em;
        font-size: 0.8rem;
        max-width: 28vw;
        min-width: 80px;
      }
    }
  </style>
</head>
<body>
  <div id="page-3" style="display:none; position:fixed; inset:0; background-color:#fff8f0; align-items:center; justify-content:center; padding:2rem; opacity:0; transition: opacity 0.8s ease; overflow-y:auto;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:2rem; width:100%;">
      <p class="texte"><span id="typed2"></span><span id="curseur2" style="display:inline-block; width:2px; height:1.1em; background:#e8a0b4; vertical-align:text-bottom; animation: clignoter 0.7s step-end infinite;"></span></p>
      <div class="cards" id="cards">
        <div class="card">Pensée 1</div>
        <div class="card">Pensée 2</div>
        <div class="card">Pensée 3</div>
      </div>
    </div>
  </div>

  <div id="page-2">
    <div style="display:flex; flex-direction:column; align-items:center; gap:2rem;">
      <p class="texte"><span id="typed"></span><span id="curseur"></span></p>
      <button id="btn-suivant" style="display:none; opacity:0; transition: opacity 0.6s ease;">Suivant →</button>
    </div>
  </div>

  <div class="container">
    <h1>Bonjour Noemie</h1>
    <p>Veut tu date avec moi ?</p>
    <div class="buttons">
      <button id="btn-oui">Oui</button>
      <button id="btn-non">Non</button>
    </div>
  </div>

  <script>
    document.getElementById('btn-oui').addEventListener('click', () => {
      gameOver = true;
      btnNon.style.display = 'none';
      document.querySelector('.container').style.display = 'none';
      const page2 = document.getElementById('page-2');
      page2.style.display = 'flex';
      requestAnimationFrame(() => requestAnimationFrame(() => page2.style.opacity = '1'));

      const texte1 = "Tres bon choix, mais avant qu'on se revoit j'aimerais que tu lise ces quelques mots qui reflètent mes pensées pour toi :";
      const el = document.getElementById('typed');
      let i = 0;
      const interval = setInterval(() => {
        el.textContent += texte1[i];
        i++;
        if (i >= texte1.length) {
          clearInterval(interval);
          document.getElementById('curseur').style.display = 'none';
          const btnSuivant = document.getElementById('btn-suivant');
          btnSuivant.style.display = 'block';
          requestAnimationFrame(() => requestAnimationFrame(() => btnSuivant.style.opacity = '1'));
          const think_card1 = "La vérité, c'est qu'il n'y a pas un seul instant où je ne pense pas à toi.\n\nTu es ma première pensée au matin, avant même que la lumière n'ose entrer.\n\nLe dernier murmure dans ma conscience avant que le sommeil ne m'emporte.\n\nIl n'existe pas un seul souffle de ma journée où tu n'es pas là, quelque part.\n\nPas un seul rêve où le désir n'enlace nos corps frémissants, sans permission, se consumant l'un dans l'autre jusqu'à l'ivresse.";
          const think_card2 = "Je n’ai aucune raison de renoncer à toi.\n\nMême si tu m'as montré la pire facette de toi-même,\nje serai toujours là.\n\nPeu importe à quel point les choses deviennent difficiles \nou à quel point ton humeur peut parfois être mauvaise,\nje continuerai à te choisir.\n\nJe n’aimerai personne d’autre.\n\nÇa a toujours été toi,\net ce sera toujours toi.";
          const think_card3 = "Alors viens on se retrouve et on s'aime bordel.\n\nViens on se dit oui on se voit et on le fait. La vie est trop courte pour qu'on se dise non.\n\nPas pour s'enfermé dans une relation mais pour laisser nos coeur vibrés de passion et nos lèvre exprimé l'attirance qu'on as l'un pour l'autre le temps d'un instant sans se dire que demain existera.\n\n Plage\n Samedi soir\n coucher du soleil ? \n\n Brunch \n Dimanche ?" ;

          let cardsShown = false;
          let currentInterval = null;

          function playThinkCard(text, cardIndex) {
            if (currentInterval) clearInterval(currentInterval);
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            if (cardIndex !== undefined) document.querySelectorAll('.card')[cardIndex].classList.add('active');
            const el2 = document.getElementById('typed2');
            const curseur2 = document.getElementById('curseur2');
            el2.innerHTML = '';
            curseur2.style.display = 'inline-block';
            let j = 0;
            currentInterval = setInterval(() => {
              if (text[j] === '\n') {
                el2.innerHTML += '<br>';
              } else {
                el2.innerHTML += text[j];
              }
              j++;
              if (j >= text.length) {
                clearInterval(currentInterval);
                curseur2.style.display = 'none';
                if (!cardsShown) {
                  cardsShown = true;
                  document.querySelectorAll('.card').forEach((card, idx) => {
                    setTimeout(() => card.classList.add('visible'), idx * 200);
                  });
                }
              }
            }, 40);
          }

          document.querySelectorAll('.card')[0].addEventListener('click', () => { if (!document.querySelectorAll('.card')[0].classList.contains('active')) playThinkCard(think_card1, 0); });
          document.querySelectorAll('.card')[1].addEventListener('click', () => { if (!document.querySelectorAll('.card')[1].classList.contains('active')) playThinkCard(think_card2, 1); });
          document.querySelectorAll('.card')[2].addEventListener('click', () => { if (!document.querySelectorAll('.card')[2].classList.contains('active')) playThinkCard(think_card3, 2); });

          btnSuivant.addEventListener('click', () => {
            document.getElementById('page-2').style.opacity = '0';
            setTimeout(() => {
              document.getElementById('page-2').style.display = 'none';
              const page3 = document.getElementById('page-3');
              page3.style.display = 'flex';
              requestAnimationFrame(() => requestAnimationFrame(() => {
                page3.style.opacity = '1';
                playThinkCard(think_card1, 0);
              }));
            }, 800);
          });
        }
      }, 40);
    });

    const btnNon = document.getElementById('btn-non');
    const TRIGGER_DISTANCE = 80;
    let escapeCount = 0;
    let lastEffectTime = 0;
    let gameOver = false;

    function spawnTexts(content, color) {
      for (let i = 0; i < 15; i++) {
        const el = document.createElement('span');
        el.textContent = content;
        el.style.cssText = `
          position: fixed;
          font-size: ${1.2 + Math.random() * 2}rem;
          font-family: 'Georgia', serif;
          font-weight: bold;
          color: ${color};
          left: ${Math.random() * 90}vw;
          top: ${Math.random() * 90}vh;
          opacity: 0;
          transition: opacity 0.4s ease;
          pointer-events: none;
          z-index: 999;
          transform: rotate(${-20 + Math.random() * 40}deg);
        `;
        document.body.appendChild(el);
        setTimeout(() => el.style.opacity = '1', 50);
        setTimeout(() => {
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 500);
        }, 2000 + Math.random() * 1000);
      }
    }

    function spawnEmojis() {
      const emojis = ['😂', '🤣', '😆', '😄'];
      for (let i = 0; i < 20; i++) {
        const el = document.createElement('span');
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.cssText = `
          position: fixed;
          font-size: ${1.5 + Math.random() * 2.5}rem;
          left: ${Math.random() * 90}vw;
          top: ${Math.random() * 90}vh;
          opacity: 0;
          transition: opacity 0.4s ease;
          pointer-events: none;
          z-index: 999;
        `;
        document.body.appendChild(el);
        setTimeout(() => el.style.opacity = '1', 50);
        setTimeout(() => {
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 500);
        }, 2000 + Math.random() * 1000);
      }
    }

    let isFixed = false;

    function handlePointer(clientX, clientY) {
      if (gameOver) return;
      const rect = btnNon.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = clientX - cx;
      const dy = clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const e = { clientX, clientY };

      if (dist < TRIGGER_DISTANCE) {
        if (!isFixed) {
          const r = btnNon.getBoundingClientRect();
          btnNon.style.position = 'fixed';
          btnNon.style.left = r.left + 'px';
          btnNon.style.top = r.top + 'px';
          isFixed = true;
        }
        const margin = 80;
        let newX, newY, attempts = 0;
        do {
          newX = margin + Math.random() * (window.innerWidth - margin * 2);
          newY = margin + Math.random() * (window.innerHeight - margin * 2);
          const fdx = clientX - newX;
          const fdy = clientY - newY;
          if (Math.sqrt(fdx * fdx + fdy * fdy) > 200) break;
          attempts++;
        } while (attempts < 15);
        btnNon.style.transform = '';
        btnNon.style.left = newX + 'px';
        btnNon.style.top = newY + 'px';
        const now = Date.now();
        if (now - lastEffectTime >= 1000) {
          lastEffectTime = now;
          escapeCount++;
          if (escapeCount === 1) spawnEmojis();
          else if (escapeCount === 2) spawnTexts('Oléééééé !', '#e8a0b4');
          else if (escapeCount === 3) spawnTexts('youhhuuuuuuu', '#f4a261');
          else if (escapeCount === 4) { spawnTexts('Oléééééé !', '#e8a0b4'); spawnEmojis(); }
          else if (escapeCount === 5) { spawnTexts('Encore raté !', '#f4a261'); spawnEmojis(); }
          else if (escapeCount === 6) {
            btnNon.style.transition += ', font-size 0.5s ease, padding 0.5s ease';
            btnNon.style.fontSize = '0.6rem';
            btnNon.style.padding = '0.3em 1em';
            const btnOui = document.getElementById('btn-oui');
            btnOui.style.transition = 'font-size 0.5s ease, padding 0.5s ease, box-shadow 0.5s ease';
            btnOui.style.fontSize = '2rem';
            btnOui.style.padding = '0.8em 2.5em';
          }
        }
      }
    }

    const isMobile = navigator.maxTouchPoints > 0;

    if (isMobile) {
      btnNon.addEventListener('touchstart', (e) => {
        e.preventDefault();
        const t = e.touches[0];
        handlePointer(t.clientX, t.clientY);
      }, { passive: false });
    } else {
      document.addEventListener('mousemove', (e) => {
        handlePointer(e.clientX, e.clientY);
      });
    }

  </script>
</body>
</html>
