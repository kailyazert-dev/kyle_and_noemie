<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bonjour Noemie</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fff8f0;
      font-family: 'Georgia', serif;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 6rem);
      color: #2c2c2c;
      text-align: center;
      letter-spacing: 0.02em;
    }

    p {
      font-size: clamp(1.2rem, 3.5vw, 2.5rem);
      color: #555;
      text-align: center;
    }

    .buttons {
      display: flex;
      gap: 2rem;
      margin-top: 0.5rem;
    }

    button {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      font-family: 'Georgia', serif;
      padding: 0.6em 2em;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    #btn-oui {
      background-color: #e8a0b4;
      color: #fff;
    }

    #btn-oui:hover {
      transform: scale(1.07);
      box-shadow: 0 4px 14px rgba(232, 160, 180, 0.5);
    }

    #btn-non {
      background-color: #ddd;
      color: #555;
      transition: left 0.1s ease, top 0.1s ease, transform 0.1s ease;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bonjour Noemie</h1>
    <p>Veut tu date avec moi ?</p>
    <div class="buttons">
      <button id="btn-oui">Oui</button>
      <button id="btn-non">Non</button>
    </div>
  </div>

  <script>
    const btnNon = document.getElementById('btn-non');
    const TRIGGER_DISTANCE = 80;
    let escapeCount = 0;

    function spawnTexts(content, color) {
      for (let i = 0; i < 15; i++) {
        const el = document.createElement('span');
        el.textContent = content;
        el.style.cssText = `
          position: fixed;
          font-size: ${1.2 + Math.random() * 2}rem;
          font-family: 'Georgia', serif;
          font-weight: bold;
          color: ${color};
          left: ${Math.random() * 90}vw;
          top: ${Math.random() * 90}vh;
          opacity: 0;
          transition: opacity 0.4s ease;
          pointer-events: none;
          z-index: 999;
          transform: rotate(${-20 + Math.random() * 40}deg);
        `;
        document.body.appendChild(el);
        setTimeout(() => el.style.opacity = '1', 50);
        setTimeout(() => {
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 500);
        }, 2000 + Math.random() * 1000);
      }
    }

    function spawnEmojis() {
      const emojis = ['😂', '🤣', '😆', '😄'];
      for (let i = 0; i < 20; i++) {
        const el = document.createElement('span');
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.cssText = `
          position: fixed;
          font-size: ${1.5 + Math.random() * 2.5}rem;
          left: ${Math.random() * 90}vw;
          top: ${Math.random() * 90}vh;
          opacity: 0;
          transition: opacity 0.4s ease;
          pointer-events: none;
          z-index: 999;
        `;
        document.body.appendChild(el);
        setTimeout(() => el.style.opacity = '1', 50);
        setTimeout(() => {
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 500);
        }, 2000 + Math.random() * 1000);
      }
    }

    btnNon.style.position = 'fixed';
    btnNon.style.left = '50%';
    btnNon.style.top = '60%';
    btnNon.style.transform = 'translate(-50%, -50%)';

    document.addEventListener('mousemove', (e) => {
      const rect = btnNon.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = e.clientX - cx;
      const dy = e.clientY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy);

      if (dist < TRIGGER_DISTANCE) {
        const margin = 80;
        let newX, newY, attempts = 0;
        do {
          newX = margin + Math.random() * (window.innerWidth - margin * 2);
          newY = margin + Math.random() * (window.innerHeight - margin * 2);
          const fdx = e.clientX - newX;
          const fdy = e.clientY - newY;
          if (Math.sqrt(fdx * fdx + fdy * fdy) > 200) break;
          attempts++;
        } while (attempts < 15);
        btnNon.style.transform = 'none';
        btnNon.style.left = newX + 'px';
        btnNon.style.top = newY + 'px';
        escapeCount++;
        if (escapeCount === 1) spawnEmojis();
        else if (escapeCount === 2) spawnTexts('Holé !', '#e8a0b4');
      }
    });
  </script>
</body>
</html>
