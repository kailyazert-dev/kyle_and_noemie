<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonjour Noemie</title>
    <link rel="stylesheet" href="index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <script src="index.js" defer></script>
</head>
<body>
    <canvas id="c-chars"    style="position:fixed;bottom:0;left:0;width:100%;height:70px;pointer-events:none;z-index:4;display:none;"></canvas>
    <canvas id="c-petals"    style="position:fixed;inset:0;pointer-events:none;z-index:4;display:none;"></canvas>
    <canvas id="c-particles" style="position:fixed;inset:0;pointer-events:none;z-index:4;display:none;"></canvas>

    <div id="page-3" style="display:none; position:fixed; inset:0; background-color:#fff8f0; align-items:flex-start; justify-content:center; padding:2rem; opacity:0; transition: opacity 0.8s ease; overflow-y:auto; -webkit-overflow-scrolling:touch;">
        <div style="display:flex; flex-direction:column; align-items:center; gap:2rem; width:100%; margin:auto 0;">
            <p class="texte"><span id="typed2"></span><span id="curseur2" style="display:inline-block; width:2px; height:1.1em; background:#e8a0b4; vertical-align:text-bottom; animation: clignoter 0.7s step-end infinite;"></span></p>
            <div id="btns-final" style="display:none; opacity:0; transition: opacity 0.7s ease; gap:1.5rem; flex-direction:row; justify-content:center; flex-wrap:wrap;">
                <a id="btn-final-oui" href="https://wa.me/33781779641?text=Oui%20%F0%9F%8C%B8%20Je%20t%E2%80%99attendais...%20%C3%80%20bient%C3%B4t%20%E2%98%80%EF%B8%8F" target="_blank" style="text-decoration:none;">
                    <button style="background:#e8a0b4; color:#fff; font-family:'Cormorant Garamond',Georgia,serif; font-size:1.3rem; padding:0.7em 2.5em; border:none; border-radius:50px; cursor:pointer; box-shadow:0 4px 16px rgba(232,160,180,0.4); transition:transform 0.15s, box-shadow 0.15s;">Oui 🌸</button>
                </a>
                <a id="btn-final-non" href="https://wa.me/33781779641?text=Non...%20(mais%20tu%20sais%20tr%C3%A8s%20bien%20que%20oui%20%F0%9F%98%8F)" target="_blank" style="text-decoration:none;">
                    <button style="background:rgba(255,255,255,0.7); color:#7a5a5a; font-family:'Cormorant Garamond',Georgia,serif; font-size:1.3rem; padding:0.7em 2.5em; border:1px solid #ddd; border-radius:50px; cursor:pointer; transition:transform 0.15s;">Non...</button>
                </a>
            </div>
            <div class="cards" id="cards">
                <div class="card">Pensée 1</div>
                <div class="card">Pensée 2</div>
                <div class="card">Pensée 3</div>
            </div>
        </div>
    </div>

    <div id="page-2">
        <div style="display:flex; flex-direction:column; align-items:center; gap:2rem;">
            <p class="texte"><span id="typed"></span><span id="curseur"></span></p>
            <button id="btn-suivant" style="display:none; opacity:0; transition: opacity 0.6s ease;">Suivant →</button>
        </div>
    </div>

    <div id="page-pense">
        <div class="page-pense-inner">
            <p class="texte"><span id="typed-pense"></span><span id="curseur-pense"></span></p>
            <a id="btn-wa-pense" href="https://wa.me/33781779641?text=Tchao%20bye%20bye%2C%20je%20veut%20plus%20te%20voir" target="_blank" style="display:none; opacity:0; transition: opacity 0.7s ease; text-decoration:none;">
                <button style="background:#e8a0b4; color:#fff; font-family:'Cormorant Garamond',Georgia,serif; font-size:1.3rem; padding:0.7em 2.5em; border:none; border-radius:50px; cursor:pointer; box-shadow:0 4px 16px rgba(232,160,180,0.4); transition:transform 0.15s, box-shadow 0.15s;">Vas-y tu me soul, jveut plus voir ta grosse tête</button>
            </a>
        </div>
        <div class="cards" id="cards-pense">
            <div class="card">Pensée 1</div>
            <div class="card">Pensée 2</div>
            <div class="card">Pensée 3</div>
        </div>
    </div>

    <div class="container">
        <h1>Bonjour Noemie</h1>
        <p>Veut tu date avec moi ?</p>
        <div class="buttons">
            <button id="btn-oui">Oui</button>
            <button id="btn-non">Non</button>
        </div>

        <div class="section-pense">
            <h2>Ce que je pense</h2>
            <button id="btn-pense">Vas-y tu me soul, dit moi</button>
        </div>
    </div>

</body>
</html>
